# Best Before agent configuration.
#
# bestbefore-agent enrol writes this file; you should rarely need to edit it.
# Unknown or repeated settings stop the agent, so a typo is never ignored.

# Where the dashboard is, and its identity, pinned at enrolment. Reports are
# encrypted to this key and replies must be signed by it.
#dashboard_url = https://dashboard.example.vpn:8443
#dashboard_key =

# The dashboard's own TLS key, pinned at enrolment when it uses its built-in
# self-signed certificate. Empty when the dashboard is behind a reverse proxy
# with a certificate from a certificate authority.
#dashboard_tls_key =

# A certificate authority to trust, in addition to the system's, for a
# reverse proxy using a private CA.
#ca_file =

# Docker access:
#   socket          read the default socket if Docker is installed; servers
#                   without Docker simply report nothing about it
#   off             never look at Docker
#   unix:///path    a specific socket
#   tcp://host:port a socket proxy allowing only the read endpoints
# Access to the Docker socket is equivalent to root, whatever the agent does
# with it: a socket proxy is recommended.
#docker = socket

{{define "title"}}Log in · Best Before{{end}}
{{define "content"}}
<section class="narrow">
	<h1>Log in</h1>
	{{with .}}{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}{{end}}
	<form method="post" action="/login" class="stack">
		<label>Email
			<input type="email" name="email" autocomplete="username" required autofocus value="{{with .}}{{.Email}}{{end}}">
		</label>
		<label>Password
			<input type="password" name="password" autocomplete="current-password" required>
		</label>
		<label>Authenticator code
			<input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
		</label>
		<button>Log in</button>
	</form>
</section>
{{end}}

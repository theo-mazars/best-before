# Best Before dashboard configuration.
#
# Every setting below shows its default. Uncomment a line to change it.
# Unknown or repeated settings stop the dashboard, so a typo is never ignored.

# Address to listen on. The default only accepts connections from this
# machine: exposing the dashboard must be a deliberate choice. Run it on a VPN
# or private network only, never on the internet.
#listen = 127.0.0.1:8443

# The address agents use to reach the dashboard, written into enrolment codes.
# Required before you can add servers. http:// is accepted for local testing:
# reports stay encrypted and signed, but which servers report, and when, is
# visible on the network.
#public_url = https://dashboard.example.vpn:8443

# Where the database and the dashboard's keys are kept. Back up this directory:
# losing identity.key means enrolling every server again.
#data_dir = /var/lib/bestbefore

# How the dashboard serves HTTPS:
#   builtin  a self-signed certificate, created on first start; agents pin it
#   files    the certificate and key below, e.g. from your own CA
#   off      plain HTTP, only on a loopback address behind a reverse proxy
#            on the same machine, which must have a CA-valid certificate
#tls = builtin
#tls_cert = /etc/bestbefore/tls.crt
#tls_key = /etc/bestbefore/tls.key

# A server is shown as stale when no report has arrived for this long. Keep it
# at about twice the agents' reporting interval (daily by default).
#stale_after = 48h

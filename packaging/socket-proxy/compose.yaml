# A Docker socket proxy for the Best Before agent: it allows exactly the read
# requests the agent makes, and nothing else. See docs/agent.md.
#
#   DOCKER_GID=$(getent group docker | cut -d: -f3) docker compose up -d
#   sudo bestbefore-agent configure docker tcp://127.0.0.1:2375

services:
  socket-proxy:
    image: docker.io/wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    # Host networking with the default listen address, 127.0.0.1: the agent
    # on this host can connect, other containers cannot.
    network_mode: host
    user: "65534:${DOCKER_GID:?set DOCKER_GID to the docker group ID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-loglevel=info'
      # Patterns are anchored (^…$) by the proxy. These are the only requests
      # the agent makes: no container logs, no file downloads, no writes.
      - '-allowGET=(/version|/containers/json|/containers/[0-9a-f]{64}/json|/images/sha256:[0-9a-f]{64}/json)'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'

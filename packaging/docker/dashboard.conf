# Default configuration of the dashboard image. Mount your own over
# /etc/bestbefore/dashboard.conf; `bestbefore config example` documents every
# setting.

# Inside the container, the dashboard listens on all interfaces: choose where
# it is exposed when publishing the port, e.g. -p 10.8.0.1:8443:8443 for a
# VPN address. Never publish it on the internet.
listen = 0.0.0.0:8443

data_dir = /var/lib/bestbefore

# Required before servers can be added: the address agents use to reach the
# dashboard.
#public_url = https://dashboard.example.vpn:8443

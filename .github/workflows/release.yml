name: Release

# Runs when a version tag (v0.1.0, v0.2.0-rc.1…) is pushed, and creates a
# draft release to review and publish by hand. See docs/releases.md.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and tests with read access only. No cache: a release is built
  # from nothing but the tagged source and pinned, checksummed modules.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check
        run: make check

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/dist.sh "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  # Signs what the build job made and drafts the release. It checks out
  # nothing and runs no code from the repository.
  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # draft the release
      id-token: write # sign with Sigstore, as this workflow
      attestations: write # record build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --strict -c SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The version whose checksums the action itself carries.
          cosign-release: v3.0.6

      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=
          case $TAG in *-*) prerelease=--prerelease ;; esac
          cat >notes.md <<EOF
          Install the agent and check the dashboard's source as described in
          [docs/releases.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/releases.md).
          Every file is listed in \`SHA256SUMS\`, signed by this repository's
          release workflow for tag \`$TAG\`.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag $prerelease --title "Best Before $TAG" --notes-file notes.md
